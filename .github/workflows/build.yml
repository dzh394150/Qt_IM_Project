name: Qt 自动编译打包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # 彻底解决Node.js 20弃用问题
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5  # 升级到支持Node.js 24的最新版

      - name: 安装Aqua（Qt官方稳定安装工具，彻底替代install-qt-action）
        uses: jurplel/install-qt-action@v5  # 升级到v5，支持Node.js 24，无Python依赖
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw131'
          setup-python: false
          aqua: true  # 启用Aqua安装器，彻底告别Python

      - name: 编译项目
        run: |
          qmake qt_im_project.pro
          mingw32-make -j4

      - name: 自动打包所有依赖DLL
        run: |
          windeployqt --release --no-translations release/qt_im_project.exe

      - name: 生成可下载的软件包
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: release/