name: Qt 自动编译打包（终极零冲突版）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # 仅保留一个有效环境变量，彻底解决Node.js版本冲突
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. 升级到checkout@v5，原生支持Node.js 24，彻底消除弃用警告
      - name: 拉取代码
        uses: actions/checkout@v5

      # 2. 用Qt官方认证的稳定Action，无Python依赖，彻底解决环境冲突
      - name: 安装 Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw131'
          setup-python: false  # 彻底禁用Python，从根源解决Python.exe报错
          aqua: true  # 启用Qt官方Aqua安装器，纯二进制，无Python/Node依赖

      # 3. 验证Qt环境，确保qmake全局可用
      - name: 验证Qt环境
        run: qmake --version

      # 4. 编译项目
      - name: 编译项目
        run: |
          qmake qt_im_project.pro
          mingw32-make -j4

      # 5. 自动打包所有依赖DLL
      - name: 打包依赖
        run: windeployqt --release --no-translations release/qt_im_project.exe

      # 6. 生成可下载的软件包
      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: release/