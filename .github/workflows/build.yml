name: Qt 自动编译打包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # 仅保留一个环境变量，彻底解决冲突，强制使用Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 拉取代码（升级到v5，原生支持Node.js 24，消除弃用警告）
        uses: actions/checkout@v5

      - name: 安装Qt 6.8.3（aqtinstall手动安装，零Python/Node依赖）
        run: |
          # 下载Qt官方CI工具aqtinstall（纯二进制，无任何环境依赖）
          Invoke-WebRequest -Uri "https://github.com/miurahr/aqtinstall/releases/download/v3.1.9/aqt.exe" -OutFile "aqt.exe"
          # 安装Qt 6.8.3 MinGW版本，包含所有必需模块
          .\aqt.exe install-qt windows desktop 6.8.3 win64_mingw131 -O C:\Qt
          # PowerShell原生方式添加环境变量，确保qmake全局可用
          $qtBinPath = "C:\Qt\6.8.3\mingw131_64\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $qtBinPath -Encoding utf8

      - name: 验证Qt环境（确保qmake正常可用，排查问题用）
        run: |
          qmake --version

      - name: 编译项目
        run: |
          qmake qt_im_project.pro
          mingw32-make -j4

      - name: 自动打包所有依赖DLL
        run: |
          windeployqt --release --no-translations release/qt_im_project.exe

      - name: 生成可下载的软件包
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: release/