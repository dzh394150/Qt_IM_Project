name: Qt Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      BUILD_DIR: build-ci
      PROJECT_FILE: 20260329windows.pro
      APP_NAME: 20260329windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6.6.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'
          setup-python: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:BUILD_DIR) {
            Remove-Item -Path $env:BUILD_DIR -Recurse -Force
          }

          New-Item -ItemType Directory -Path $env:BUILD_DIR | Out-Null
          Set-Location $env:BUILD_DIR

          qmake "..\$env:PROJECT_FILE" "CONFIG+=release"
          nmake /NOLOGO

      - name: Copy Runtime Assets
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:BUILD_DIR 'release'
          $exePath = Join-Path $releaseDir "$env:APP_NAME.exe"

          if (!(Test-Path $releaseDir)) {
            throw "Release output directory not found: $releaseDir"
          }
          if (!(Test-Path $exePath)) {
            throw "Built executable not found: $exePath"
          }

          foreach ($asset in @('btnimage', 'cert')) {
            if (!(Test-Path $asset)) {
              throw "Missing runtime asset directory: $asset"
            }
            Copy-Item -Path $asset -Destination (Join-Path $releaseDir $asset) -Recurse -Force
          }

      - name: Deploy Qt Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:BUILD_DIR 'release'
          Set-Location $releaseDir
          windeployqt --release --compiler-runtime --no-translations "$env:APP_NAME.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 20260329windows-windows
          path: build-ci/release/
          if-no-files-found: error
