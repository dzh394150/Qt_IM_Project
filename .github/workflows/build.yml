name: Qt 自动编译打包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # 🔥 核心修正：Qt 6.10.1 正确架构 = win64_mingw142（不是131）
      - name: 安装Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw142'  # ✅ 这里是修复的关键！
          setup-python: false

      # 编译项目（外部构建，规范无冲突）
      - name: 编译项目
        run: |
          mkdir build
          cd build
          qmake ..\qt_im_project.pro
          mingw32-make -j4

      # 打包Qt所有依赖
      - name: 打包依赖
        run: |
          cd build/release
          windeployqt --release --no-translations qt_im_project.exe

      # 上传成品
      - name: 上传软件包
        uses: actions/upload-artifact@v4
        with:
          name: Qt_IM_Project_Windows
          path: build/release/