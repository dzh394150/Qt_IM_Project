name: Qt 自动编译打包（终极零冲突版）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 禁用 Python 和权限问题相关的环境变量
      PATH: ${{ github.env.PATH }};C:\hostedtoolcache\windows\Python\3.12.10\x64
      PYTHONHOME: ""

    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v5

      # 2. 安装 Qt 6.10.1
      - name: 安装 Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw131'
          setup-python: false  # 禁用Python
          
      # 3. 验证Qt环境，确保qmake可用
      - name: 验证Qt环境
        run: qmake --version

      # 4. 编译项目
      - name: 编译项目
        run: |
          qmake qt_im_project.pro
          mingw32-make -j4

      # 5. 打包所有依赖
      - name: 打包依赖
        run: windeployqt --release --no-translations release/qt_im_project.exe

      # 6. 上传生成的软件包
      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: release/

      # 7. 确认可用的 Qt 架构和版本
      - name: 列出可用的 Qt 版本
        run: |
          python -m aqt list-qt windows desktop --arch 6.10.1