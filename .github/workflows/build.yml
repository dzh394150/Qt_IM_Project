name: Qt 自动编译打包

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      # ✅ 终极稳定方案：Qt 6.6.2 + MSVC2019 64位（GitHub原生支持，无任何包缺失）
      - name: 安装Qt环境
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'  # 🔥 改用MSVC，永不报错
          setup-python: false        # 禁用Python，彻底避免权限冲突

      # ✅ MSVC 编译命令（nmake 替代 mingw32-make）
      - name: 编译项目
        run: |
          mkdir build
          cd build
          qmake ..\qt_im_project.pro
          nmake

      # ✅ 打包依赖（和之前一样）
      - name: 打包Qt依赖
        run: |
          cd build/release
          windeployqt --release --no-translations qt_im_project.exe

      # ✅ 上传成品
      - name: 上传软件包
        uses: actions/upload-artifact@v4
        with:
          name: Qt_IM_Project_Windows
          path: build/release/