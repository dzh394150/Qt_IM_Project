name: Qt Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      BUILD_DIR: build-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Project Metadata
        id: resolve_project
        run: |
          $ErrorActionPreference = 'Stop'
          $proFiles = Get-ChildItem -File *.pro

          if ($proFiles.Count -ne 1) {
            throw "Expected exactly one .pro file in repository root, found $($proFiles.Count)."
          }

          $projectFile = $proFiles[0].Name
          $appName = $proFiles[0].BaseName

          "PROJECT_FILE=$projectFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_NAME=$appName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "project_file=$projectFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_name=$appName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Qt 6.6.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'
          setup-python: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($path in @($env:BUILD_DIR, 'release', 'debug', 'Makefile', '.qmake.stash')) {
            if (Test-Path $path) {
              Remove-Item -Path $path -Recurse -Force
            }
          }

          qmake $env:PROJECT_FILE "CONFIG+=release"
          nmake /NOLOGO

      - name: Stage Release Package
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:BUILD_DIR 'release'

          if (Test-Path $env:BUILD_DIR) {
            Remove-Item -Path $env:BUILD_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $candidateExePaths = @(
            (Join-Path 'release' "$env:APP_NAME.exe"),
            (Join-Path '.' "$env:APP_NAME.exe")
          )

          $exePath = $candidateExePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (!(Test-Path $exePath)) {
            throw "Built executable not found. Checked: $($candidateExePaths -join ', ')"
          }

          Copy-Item -Path $exePath -Destination (Join-Path $releaseDir "$env:APP_NAME.exe") -Force

          foreach ($asset in @('btnimage', 'cert')) {
            if (!(Test-Path $asset)) {
              throw "Missing runtime asset directory: $asset"
            }
            Copy-Item -Path $asset -Destination (Join-Path $releaseDir $asset) -Recurse -Force
          }

      - name: Deploy Qt Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:BUILD_DIR 'release'
          Set-Location $releaseDir
          windeployqt --release --compiler-runtime --no-translations "$env:APP_NAME.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_project.outputs.app_name }}-windows
          path: build-ci/release/
          if-no-files-found: error
